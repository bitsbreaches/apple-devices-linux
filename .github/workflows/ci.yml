# Continuous integration: lint and test every push and pull request.
#
# SPDX-License-Identifier: GPL-3.0-only
# Copyright (C) 2026 Device Dock Contributors
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-secret-1 python3-cryptography python3-pycryptodome python3-qrcode \
            libimobiledevice-utils xvfb dbus
      - name: Install Python packages
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pytest pyflakes
      - name: Lint
        run: .venv/bin/python -m pyflakes devicedock tests scripts
      - name: Run tests
        run: .venv/bin/python -m pytest tests -q
      - name: Drive the user interface headlessly
        run: |
          dbus-run-session -- xvfb-run -a .venv/bin/python tests/ui_smoke.py \
            --out "$RUNNER_TEMP/ui-shots"
      - name: Build the Debian package
        run: |
          docker info >/dev/null
          ./packaging/build-deb.sh
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: device-dock-deb
          path: dist/device-dock_*_amd64.deb
          if-no-files-found: error
